# Push to a branch other than main: signed release APK artifact and public prerelease.
# Push to main: signed AAB, published to Play open testing (track beta).

name: Android

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  apk:
    name: Release APK
    if: github.repository == 'fuflomycin/fuflomycin-expo' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install catalog compiler
        run: npm ci

      - name: Test catalog compiler
        run: npm test

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: python3 scripts/ci-android-env.py keystore

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          file="fuflomycin-${version}-${sha}-release.apk"
          title="fuflomycin-${version}-${sha}"
          cp android/app/build/outputs/apk/release/app-release.apk "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="apk-${{ steps.apk.outputs.sha }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "prerelease $tag already exists"
            exit 0
          fi
          python3 scripts/play-open-track.py note > "$RUNNER_TEMP/apk-notes.txt"
          gh release create "$tag" \
            "${{ steps.apk.outputs.file }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.apk.outputs.title }}" \
            --notes-file "$RUNNER_TEMP/apk-notes.txt" \
            --prerelease

  aab:
    name: Open testing AAB
    if: github.repository == 'fuflomycin/fuflomycin-expo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: play-open
    concurrency:
      group: play-open
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install catalog compiler
        run: npm ci

      - name: Test catalog compiler
        run: npm test

      - name: Check Play version script
        run: python3 scripts/play-open-track.py self-check

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: python3 scripts/ci-android-env.py keystore

      - name: Write Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$PLAY_SERVICE_ACCOUNT_JSON"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          chmod 600 "$RUNNER_TEMP/play-service-account.json"

      - name: Play version code
        id: version
        env:
          PLAY_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/play-service-account.json
        run: |
          code=$(python3 scripts/play-open-track.py version-code)
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Bundle release
        working-directory: android
        run: ./gradlew :app:bundleRelease -Pfuflomycin.versionCode=${{ steps.version.outputs.code }}

      - name: Check upload certificate
        env:
          AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
        run: python3 scripts/play-open-track.py check-cert

      - name: Name the AAB
        id: aab
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          file="fuflomycin-${version}-${{ steps.version.outputs.code }}-${sha}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.aab.outputs.file }}
          path: ${{ steps.aab.outputs.file }}
          if-no-files-found: error

      - name: Release notes
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 scripts/play-open-track.py note > "$RUNNER_TEMP/release-notes.txt"

      - name: Publish to open testing
        env:
          AAB_PATH: ${{ steps.aab.outputs.file }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.txt
          PLAY_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/play-service-account.json
        run: python3 scripts/play-open-track.py publish
